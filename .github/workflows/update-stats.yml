name: 🐰 Bunny Stats Hunter

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node src/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🐰 Caça diária atualizada"
          commit_user_name: "Bunny Hunter Bot"
          commit_user_email: "equipeyezzy@outlook.com"